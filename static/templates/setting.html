{{template "header"}}
<style>
    /* Enhanced Uploader Styles */
    .avatar-uploader .el-upload {
        border: 2px dashed #dcdfe6;
        border-radius: 8px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .avatar-uploader .el-upload:hover {
        border-color: #409EFF;
        box-shadow: 0 2px 12px 0 rgba(64, 158, 255, 0.2);
    }
    .avatar-uploader-icon {
        font-size: 32px;
        color: #c0c4cc;
        width: 180px;
        height: 180px;
        line-height: 180px;
        text-align: center;
    }
    .avatar {
        width: 180px;
        height: 180px;
        display: block;
        object-fit: cover;
        border-radius: 6px;
    }

    /* Form Styling */
    .profile-form {
        margin: 0 auto;
        padding: 24px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.05);
    }

    .form-section {
        margin-bottom: 32px;
    }

    .form-title {
        font-size: 18px;
        color: #303133;
        margin-bottom: 24px;
        padding-bottom: 12px;
        border-bottom: 1px solid #ebeef5;
    }

    .el-form-item__label {
        font-weight: 500;
        color: #606266;
    }

    /* Table Styling */
    .config-table {
        margin-top: 32px;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.05);
    }

    .config-textarea .el-textarea__inner {
        min-height: 80px !important;
        font-family: monospace;
    }
</style>
<div id="app" style="width:100%; background: #f5f7fa;">
    <template>
        <div class="profile-form">
            <h3 class="form-title"><{lang.profileSettings}></h3>

            <el-form  label-width="180px" label-position="left">
                <el-form-item :label="lang.username">
                    <el-input v-model="kefuInfo.username" :placeholder="lang.enterUsername"></el-input>
                </el-form-item>

                <el-form-item :label="lang.displayName">
                    <el-input v-model="kefuInfo.nickname" :placeholder="lang.createDisplayName"></el-input>
                </el-form-item>

                <el-form-item :label="lang.newPassword">
                    <el-input
                            v-model="kefuInfo.password"
                            type="password"
                            :placeholder="lang.newPassword"
                            show-password>
                    </el-input>
                </el-form-item>

                <el-form-item :label="lang.currentAvatar">
                    <el-avatar :size="120" :src="kefuInfo.avator"></el-avatar>
                </el-form-item>

                <el-form-item :label="lang.uploadNewAvatar">
                    <el-upload
                            class="avatar-uploader"
                            action="/uploadimg"
                            :show-file-list="false"
                            name="imgfile"
                            :on-success="handleAvatarSuccess"
                            :before-upload="beforeAvatarUpload">
                        <i class="el-icon-plus avatar-uploader-icon"></i>
                    </el-upload>
                    <div class="el-upload__tip">JPG/PNG < 2MB</div>
                </el-form-item>

                <el-form-item>
                    <el-button type="primary" @click="setUser()"><{lang.saveChanges}></el-button>
                </el-form-item>
            </el-form>
        </div>

        <div class="profile-form" style="margin-top: 20px">
            <h3 class="form-title"><{lang.userManagement}></h3>
            <div style="margin-bottom: 16px;">
                <el-button type="primary" size="small" @click="showCreateUser=true"><{lang.addUser}></el-button>
            </div>
            <el-table :data="kefuList" stripe style="width: 100%">
                <el-table-column prop="id" label="ID" width="60"></el-table-column>
                <el-table-column prop="name" :label="lang.username"></el-table-column>
                <el-table-column prop="nickname" :label="lang.displayName"></el-table-column>
                <el-table-column prop="avator" :label="lang.currentAvatar" width="80">
                    <template slot-scope="scope">
                        <el-avatar :size="32" :src="scope.row.avator"></el-avatar>
                    </template>
                </el-table-column>
                <el-table-column :label="lang.action" width="80">
                    <template slot-scope="scope">
                        <el-button type="danger" size="mini" @click="deleteUser(scope.row.id)" :disabled="scope.row.name=='agent'"><{lang.delete}></el-button>
                    </template>
                </el-table-column>
            </el-table>
        </div>

        <el-dialog :title="lang.addUser" :visible.sync="showCreateUser" width="400px">
            <el-form label-width="100px">
                <el-form-item :label="lang.username">
                    <el-input v-model="newUser.name"></el-input>
                </el-form-item>
                <el-form-item :label="lang.displayName">
                    <el-input v-model="newUser.nickname"></el-input>
                </el-form-item>
                <el-form-item :label="lang.newPassword">
                    <el-input v-model="newUser.password" type="password" show-password></el-input>
                </el-form-item>
            </el-form>
            <span slot="footer">
                <el-button @click="showCreateUser=false"><{lang.cancel}></el-button>
                <el-button type="primary" @click="createUser()"><{lang.confirm}></el-button>
            </span>
        </el-dialog>

        <div class="profile-form" style="margin-top: 20px">
            <h3 class="form-title"><{lang.systemConfig}></h3>
            <el-table
                    :data="configList"
                    class="config-table"
                    stripe
                    style="width: 100%">
                <el-table-column
                        width="180"
                        prop="conf_name"
                        :label="lang.parameterName">
                </el-table-column>

                <el-table-column
                        prop="id"
                        :label="lang.value">
                    <template slot-scope="scope">
                        <el-input
                                type="textarea"
                                class="config-textarea"
                                @change="setConfigItem(scope.row.conf_key,scope.row.conf_value)"
                                v-model="scope.row.conf_value"
                                :autosize="{ minRows: 1, maxRows: 4 }">
                        </el-input>
                    </template>
                </el-table-column>
            </el-table>
        </div>
    </template>
</div>
</body>
{{template "setting_bottom" .}}
